name: ✨ 功能建议
description: 想要新的能力、新的接入协议、更好的交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说说你**实际遇到的场景**比「加个功能」更有用——我会按场景权衡该不该做、怎么做。

  - type: textarea
    id: scene
    attributes:
      label: 你遇到的使用场景
      description: 你在做什么，卡在哪一步
      placeholder: 我们学校用的平台要 POST 一个很奇怪的 JSON，现在得自己写脚本转一道
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么工作
      placeholder: 希望「接入方式」页能直接贴一个自定义 JSON 模板，我把字段映射填进去
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕过去的（可选）
      placeholder: 每次手动查一下题库再复制答案，很麻烦

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（可选）
      options:
        - 只影响我自己
        - 一个题库 / 一门课
        - 一类使用场景（很多人会遇到）
    validations:
      required: false
